version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplylog_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: SupplyLogTMS
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: supplylog_db
      DB_USERNAME: supplylog_user
      DB_PASSWORD: supplylog_password
      BROADCAST_CONNECTION: reverb
      REDIS_HOST: redis
    ports:
      - "8001:8000"
      - "8080:8080" # Laravel Reverb WebSocket port
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - supplylog_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supplylog_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api/v1
    depends_on:
      - backend
    networks:
      - supplylog_network

  postgres:
    image: postgres:16-alpine
    container_name: supplylog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supplylog_db
      POSTGRES_USER: supplylog_user
      POSTGRES_PASSWORD: supplylog_password
    ports:
      - "5434:5432"
    volumes:
      - supplylog_pgdata:/var/lib/postgresql/data
      - ./backend/database/init_supplylog.sql:/docker-entrypoint-initdb.d/init_supplylog.sql
    networks:
      - supplylog_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: supplylog_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@platform.bj
      PGADMIN_DEFAULT_PASSWORD: Christophe
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - supplylog_network

  redis:
    image: redis:7-alpine
    container_name: supplylog_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - supplylog_network

networks:
  supplylog_network:
    driver: bridge

volumes:
  supplylog_pgdata:
